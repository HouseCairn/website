# Checks of every pull request: tokens in step with the application, build,
# strict-CSP output without JavaScript, weight budget, and Lighthouse scores.
# Actions are pinned by full commit SHA (tag in the trailing comment).
name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  site:
    name: Build, budget and Lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Design tokens match the application
        run: node scripts/tokens.mjs --upstream

      - name: Build
        run: npm run build

      - name: CSP, JavaScript and weight checks
        run: npm run check

      - name: Lighthouse (home, English and French, mobile and desktop)
        run: npm run lighthouse
