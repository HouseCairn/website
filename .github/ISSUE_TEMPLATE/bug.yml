name: Something does not work
description: Tell us what went wrong with the Housecairn website.
labels:
  - bug
assignees:
  - Robvred
body:
  - type: markdown
    attributes:
      value: |
        Thank you for telling us. Short answers are fine.
        For a security problem, do not use this form: see the security policy and report it privately.
  - type: textarea
    id: happened
    attributes:
      label: What happened?
      description: Tell us what you did and what you saw.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
  - type: textarea
    id: steps
    attributes:
      label: How can we see it ourselves?
      description: The steps, one per line.
  - type: input
    id: version
    attributes:
      label: "Page address"
      description: "The address of the page with the problem."
    validations:
      required: true
  - type: input
    id: access
    attributes:
      label: "Browser and device"
      description: "For example: Firefox on a laptop, or Safari on an iPhone."
    validations:
      required: true
  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot (optional)
      description: Drag a picture here. Hide anything private first.
